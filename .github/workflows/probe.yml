name: Probe sources (one-off)

on:
  push:
    paths: [".github/workflows/probe.yml", "scripts/probe.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe.py
      - name: Commit snapshots
        run: |
          git config user.name "race-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "Probe: save source page snapshots" || echo "nothing to commit"
          git push
