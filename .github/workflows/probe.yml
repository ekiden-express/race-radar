name: Probe sources (one-off)
on:
  push:
    paths: ["scripts/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests && python scripts/probe.py
      - run: |
          git config user.name "race-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe && git commit -m "Probe: candidate sources" && git pull --rebase -X theirs && git push
